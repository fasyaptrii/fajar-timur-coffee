<!doctype html>
<html lang="id">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Masuk Staf — Fajar Timur Coffee</title><link rel="stylesheet" href="/css/app.css">
    </head>
<body>
    <div class="login"><h1>Fajar Timur Coffee</h1>
    <p class="muted">Masuk untuk Owner, Admin, dan Kasir</p>
    <form id="f" class="card">
        <div id="msg" class="err hidden" role="alert"></div>
        <label for="u">Username</label>
        <input id="u" autocomplete="username" required autofocus>
        <label for="p">Password</label>
        <input id="p" type="password" autocomplete="current-password" required>
        <p><button class="btn" style="width:100%">Masuk</button></p>
    </form>
</div>
<script src="/js/common.js"></script>
<script src="/js/login.js"></script>
</body></html>
